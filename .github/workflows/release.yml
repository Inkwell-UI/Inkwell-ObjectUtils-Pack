name: Validate and release

# Every push and pull request: validate and test. A tag v<version> (equal to manifest.json's version) also publishes pack.zip
# as the release asset the Inkwell editor downloads (https://github.com/<owner>/<repo>/releases/download/v<version>/pack.zip).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      # the validator comes from Inkwell-Core-Pack, which links inkwell-spec: all three side by side
      - uses: actions/checkout@v4
        with:
          path: pack
      - uses: actions/checkout@v4
        with:
          repository: Inkwell-UI/Inkwell-Core-Pack
          path: Inkwell-Core-Pack
      - uses: actions/checkout@v4
        with:
          repository: Inkwell-UI/Inkwell-Spec
          path: Inkwell-Spec
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile && yarn build
        working-directory: Inkwell-Spec
      - run: yarn install --frozen-lockfile
        working-directory: Inkwell-Core-Pack
      - run: yarn install && yarn validate && yarn test
        working-directory: pack
      - name: Build pack.zip and publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; fi
          zip -r -X pack.zip manifest.json nodes templates CHANGELOG.md
          sha256sum pack.zip
          gh release create "$GITHUB_REF_NAME" pack.zip --title "$GITHUB_REF_NAME" --notes "SHA-256: $(sha256sum pack.zip | cut -d' ' -f1)"
